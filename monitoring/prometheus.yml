# =====================================================
# Prometheus 抓取配置
# =====================================================
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'jade-demo'
    metrics_path: /q/metrics
    static_configs:
      - targets: ['jade-demo:8080']
    scrape_timeout: 5s
